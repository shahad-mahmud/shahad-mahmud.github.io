<rect x="358" y="232" width="76" height="40" rx="20" fill="#ffffff" stroke="#e1e0d9" stroke-width="1"/>
<text x="396" y="257" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="500" fill="#0e1116" text-anchor="middle" >w1</text>
<path d="M434 252 C 460 252, 460 300, 478 300" fill="none" stroke="#0e1116" stroke-width="2" marker-end="url(#a)"/>
<rect x="88" y="300" width="214" height="44" rx="22" fill="#eae9e3" stroke="#e1e0d9" stroke-width="1"/>
