<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-labelledby="t d">
<title id="t">Concat and pass</title>
<desc id="d">Before: the AI service sends independent chunks Hello, world and an exclamation mark to three stateless workers, and the database row ends up out of order. After: each event carries the full message so far, so whichever worker writes last can store the complete message.</desc>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0e1116"/></marker>
  <marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ff6b2c"/></marker>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#e1e0d9"/></pattern>
</defs>
<rect width="1200" height="600" fill="#f2f1ec"/>
<rect width="1200" height="600" fill="url(#dots)"/>
<text x="60" y="58" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="500" fill="#585b63" text-anchor="start" letter-spacing="1.4">CONCAT AND PASS</text>
<text x="60" y="92" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="800" fill="#0e1116" text-anchor="start" >Send the whole message so far, not just the new piece</text>
<rect x="60" y="130" width="520" height="420" rx="24" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5"/>
<text x="88" y="168" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#0e1116" text-anchor="start" >Before: independent chunks</text>
<text x="88" y="194" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="400" fill="#585b63" text-anchor="start" >Each worker only sees its own piece.</text>
<rect x="88" y="230" width="214" height="44" rx="22" fill="#eae9e3" stroke="#e1e0d9" stroke-width="1"/>
<text x="106" y="258" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="500" fill="#0e1116" text-anchor="start" >"Hello"</text>
<text x="288" y="258" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="400" fill="#585b63" text-anchor="end" >#1</text>
