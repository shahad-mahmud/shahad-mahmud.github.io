<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-labelledby="t d">
<title id="t">Scaling up vs scaling out</title>
<desc id="d">Scaling up replaces a small server with one much larger server, which is simple but expensive and has an upper limit. Scaling out puts a load balancer in front of several identical small servers that share nothing, so capacity grows by adding nodes.</desc>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0e1116"/></marker>
  <marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ff6b2c"/></marker>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#e1e0d9"/></pattern>
</defs>
<rect width="1200" height="600" fill="#f2f1ec"/>
<rect width="1200" height="600" fill="url(#dots)"/>
<text x="60" y="58" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="500" fill="#585b63" text-anchor="start" letter-spacing="1.4">SCALING STRATEGIES</text>
<text x="60" y="92" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="800" fill="#0e1116" text-anchor="start" >Scaling up vs scaling out</text>
<rect x="60" y="130" width="520" height="420" rx="24" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5"/>
<text x="88" y="168" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#0e1116" text-anchor="start" >Scaling up (vertical)</text>
<text x="88" y="194" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="400" fill="#585b63" text-anchor="start" >One machine, made bigger.</text>
<rect x="120" y="330" width="110" height="90" rx="14" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5"/>
<rect x="130" y="342.0" width="90" height="16.0" rx="6" fill="none" stroke="#e1e0d9" stroke-width="1"/>
<circle cx="208" cy="350.0" r="3.5" fill="#ff6b2c"/>
