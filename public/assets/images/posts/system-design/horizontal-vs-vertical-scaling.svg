<path d="M250 375 L340 375" fill="none" stroke="#ff6b2c" stroke-width="2" marker-end="url(#as)"/>
<rect x="360" y="230" width="170" height="200" rx="14" fill="#1a2b6b" stroke="#1a2b6b" stroke-width="1.5"/>
<rect x="370" y="242.0" width="150" height="52.666666666666664" rx="6" fill="none" stroke="#c9d1f0" stroke-width="1"/>
<circle cx="508" cy="268.3333333333333" r="3.5" fill="#ff6b2c"/>
