<circle cx="508" cy="385.66666666666663" r="3.5" fill="#ff6b2c"/>
<text x="445" y="456" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="400" fill="#585b63" text-anchor="middle" >64 vCPU · 512 GB</text>
<text x="88" y="520" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="400" fill="#585b63" text-anchor="start" >Simple to run, but costly and capped by the biggest box.</text>
<rect x="620" y="130" width="520" height="420" rx="24" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5"/>
<text x="648" y="168" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#0e1116" text-anchor="start" >Scaling out (horizontal)</text>
