<text x="648" y="520" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="400" fill="#585b63" text-anchor="start" >Grows with demand; add or remove nodes as load changes.</text>
