<text x="60" y="92" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="800" fill="#0e1116" text-anchor="start" >Streaming AI output, written safely by stateless workers</text>
