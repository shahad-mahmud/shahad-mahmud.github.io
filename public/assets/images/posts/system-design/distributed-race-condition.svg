<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-labelledby="t d">
<title id="t">Final system architecture</title>
<desc id="d">Frontend creates a task, the backend dispatches it to the Python AI service. The AI service streams the full message so far into RabbitMQ, where stateless backend workers compete for it and write to Postgres with a conditional UPSERT that only accepts newer chunks. Supabase Realtime streams row updates back to the frontend.</desc>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0e1116"/></marker>
  <marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ff6b2c"/></marker>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#e1e0d9"/></pattern>
</defs>
